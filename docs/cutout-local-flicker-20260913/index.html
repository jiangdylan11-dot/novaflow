<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>抠图修复 · 验收</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#13161c;color:#e8edf4;font:15px/1.6 "Microsoft YaHei",sans-serif}main{max-width:1250px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 8px}p{color:#b6bfcc;margin:8px 0 14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}button,a{font:inherit}button{border:1px solid #475364;background:#252d39;color:#edf4fa;border-radius:7px;padding:7px 14px;cursor:pointer}button.active{background:#146346;border-color:#55cc9d}a{color:#81dcb5}video{width:100%;max-height:78vh;background:#06080b}#stage{overflow:auto;background:#080a0e;border:1px solid #333d4c}canvas{display:block;max-width:100%;max-height:78vh;margin:auto}canvas.actual{max-width:none;max-height:none}input[type=range]{flex:1;min-width:220px;accent-color:#58cca6}.note{padding:12px 16px;background:#242b34;border-left:3px solid #72caae}small{color:#aebac8}[hidden]{display:none!important}
</style>
<main><h1>薄纱局部闪动 · 动态对比</h1><p>保留上一版整体效果，只细化薄纱随动作移动时的匹配精度。各段均开启「光效透明保留」与「保留投影」。</p>
<p><a href="gloweyes-detail.mp4">打开薄纱局部放大对比</a></p>
<div class="row" id="clips"><button data-clip="gloweyes" class="active">雅典娜 · Gloweyes</button><button data-clip="athena">雅典娜 · DivinePower</button><button data-clip="blue">蓝幕金树</button><button data-clip="minimax">青蓝剑光</button><button data-clip="scatter">黑底 Scatter</button></div>
<div class="note">左侧是你反馈「好很多了」的版本，右侧是本次程序导出；雅典娜下排为薄纱局部放大。请连续播放观察薄纱是否闪动，另切到透明 PNG 检查黑底边缘。所有结果等待动态验收。</div>
<div class="row"><button data-mode="video" class="active">播放修复对比</button><button data-mode="png">逐帧检查透明 PNG</button><a id="openVideo">打开视频文件</a><a id="openPng">打开当前原始 PNG</a></div>
<div id="stage"><video id="video" controls muted loop playsinline></video><canvas id="canvas" hidden></canvas></div>
<div class="row"><button id="prev">上一帧</button><input id="frame" aria-label="帧位置" type="range"><button id="next">下一帧</button><span id="readout"></span></div>
<div class="row" id="pngControls" hidden><button data-bg="scene" class="active">场景</button><button data-bg="black">黑底</button><button data-bg="white">白底</button><button data-bg="checker">透明棋盘</button><label><input id="focus" type="checkbox" checked>主体区域</label><label><input id="actual" type="checkbox">100% 显示</label></div>
<p><small>画面和遮罩按实际图像匹配。验证回放已有 AI 遮罩，使用当前程序的真实 PNG 导出；显示时仅合成背景。<a href="验收说明.md">查看范围和验证记录</a></small></p>
</main>
<script>
const data={gloweyes:{n:121,w:1080,h:1920,start:53,crop:[60,880,1020,870]},athena:{n:117,w:1080,h:1920,start:0,crop:[60,940,1020,850]},blue:{n:73,w:960,h:960,start:34,crop:[0,0,960,960]},minimax:{n:73,w:736,h:1280,start:34,crop:[0,160,736,734]},scatter:{n:73,w:960,h:960,start:34,crop:[42,101,918,737]}};
const $=id=>document.getElementById(id),video=$('video'),canvas=$('canvas'),ctx=canvas.getContext('2d'),scene=new Image();scene.src='scene.png';
let selected='gloweyes',mode='video',bg='scene',frame=53,token=0;
function active(attr,value){document.querySelectorAll('['+attr+']').forEach(b=>b.classList.toggle('active',b.getAttribute(attr)===value));}
function file(){return selected+'/frames/clean_'+String(frame).padStart(4,'0')+'.png';}
function position(){const d=data[selected];$('frame').value=frame;$('readout').textContent=`${frame+1} / ${d.n} 帧`;$('openPng').href=file();}
async function draw(){const id=++token,d=data[selected],img=new Image();img.src=file();await img.decode();if(id!==token)return;const temp=document.createElement('canvas');temp.width=d.w;temp.height=d.h;const c=temp.getContext('2d');
 if(bg==='scene'){await scene.decode();if(id!==token)return;c.drawImage(scene,0,0,d.w,d.h);}else if(bg==='checker'){for(let y=0;y<d.h;y+=24)for(let x=0;x<d.w;x+=24){c.fillStyle=(x/24+y/24)%2?'#888':'#bbb';c.fillRect(x,y,24,24);}}else{c.fillStyle=bg;c.fillRect(0,0,d.w,d.h);}c.drawImage(img,0,0);
 const crop=$('focus').checked?d.crop:[0,0,d.w,d.h];canvas.width=crop[2];canvas.height=crop[3];ctx.drawImage(temp,...crop,0,0,canvas.width,canvas.height);canvas.dataset.frame=frame;canvas.dataset.background=bg;
}
function refresh(){active('data-clip',selected);active('data-mode',mode);video.pause();video.hidden=mode==='png';canvas.hidden=mode!=='png';$('pngControls').hidden=mode!=='png';$('frame').max=data[selected].n-1;$('openVideo').href=selected+'-compare.mp4';position();if(mode==='png')draw();else{video.src=selected+'-compare.mp4';video.onloadedmetadata=()=>video.currentTime=(frame+.2)/24;}}
function seek(n){frame=Math.max(0,Math.min(data[selected].n-1,n));position();if(mode==='png')draw();else{video.pause();video.currentTime=(frame+.2)/24;}}
document.querySelectorAll('[data-clip]').forEach(b=>b.onclick=()=>{selected=b.dataset.clip;frame=data[selected].start;refresh();});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;refresh();});document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{bg=b.dataset.bg;active('data-bg',bg);draw();});$('prev').onclick=()=>seek(frame-1);$('next').onclick=()=>seek(frame+1);$('frame').oninput=e=>seek(+e.target.value);$('focus').onchange=draw;$('actual').onchange=e=>canvas.classList.toggle('actual',e.target.checked);video.ontimeupdate=()=>{if(mode==='video'){frame=Math.min(data[selected].n-1,Math.floor(video.currentTime*24));position();}};refresh();
</script></html>
