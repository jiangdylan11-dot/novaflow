<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>当前抠图结果 · 验收</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101216;color:#e7e9ee;font:15px/1.6 "Microsoft YaHei",sans-serif}main{max-width:1280px;margin:auto;padding:28px}h1{font-size:25px;margin:0 0 8px}p{color:#aeb7c5;margin:6px 0 16px}.tabs,.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0}button,a{font:inherit}button{background:#242a33;color:#edf1f5;border:1px solid #3c4554;padding:8px 15px;border-radius:7px;cursor:pointer}button.active{background:#155d47;border-color:#48bf94}a{color:#82d8bf}.note{background:#22282e;border-left:3px solid #f2bf64;padding:12px 16px;margin:16px 0}video{width:100%;max-height:76vh;background:#050505;display:block}#stage{background:#090b0f;border:1px solid #303742;border-radius:8px;overflow:auto;text-align:center}canvas{display:block;width:auto;max-width:100%;max-height:76vh;margin:auto}canvas.actual{max-width:none;max-height:none}input[type=range]{flex:1;min-width:180px;accent-color:#4dd5a0}#readout{min-width:105px}#imageControls[hidden],video[hidden],#pngPane[hidden]{display:none}small{color:#adb7c5}.downloads{display:flex;gap:20px;flex-wrap:wrap;margin-top:18px}
</style>
<main><h1>历史测试记录 · 已撤销验收用途</h1><p class="note">本页缓存 AI 遮罩按时间轴编号回放，与部分实际画面错帧，不能继续用于画质验收。Scatter 已重新匹配并导出，见 <a href="../cutout-baseline-audit-20260913/Scatter_遮罩错配校正_对比.mp4">校正后的对比视频</a>。雅典娜认可基准是独立离线样片，当前程序尚未达到同样效果。以下文件保留作问题追溯。</p>
<div class="tabs" id="clips"><button data-clip="scatter" class="active">黑底光效</button><button data-clip="gloweyes">人物 / 薄纱 / 投影</button><button data-clip="blue">蓝幕金树</button><button data-clip="minimax">青蓝剑光</button></div>
<div class="note" id="note"></div>
<div class="controls"><button data-mode="compare" class="active">你的导出 ↔ 当前结果</button><button data-mode="video">四宫格视频</button><button data-mode="png">透明 PNG 验收</button></div>
<div id="stage"><video id="video" controls muted playsinline loop></video><div id="pngPane" hidden><canvas id="canvas"></canvas></div></div>
<div class="controls"><button id="prev">上一帧</button><input aria-label="帧位置" id="frame" type="range" min="0" max="72" value="54"><button id="next">下一帧</button><span id="readout"></span></div>
<div class="controls" id="imageControls" hidden><span>PNG 合成背景</span><button data-bg="checker" class="active">透明棋盘</button><button data-bg="white">白色</button><button data-bg="black">黑色</button><button data-bg="scene">场景</button><label><input id="zoom" type="checkbox">100% 原尺寸</label></div>
<small>视频是区域放大预览。切到「透明 PNG 验收」可检查完整画布、原始透明度与背景合成；未做额外修图。</small>
<div class="downloads"><a id="pngLink" target="_blank">打开当前帧原始 PNG</a><a id="videoLink" target="_blank">打开当前视频</a><a href="透明序列帧_四段.zip">下载四段透明序列帧</a></div>
</main>
<script>
const clips={scatter:{count:73,w:960,h:960,focus:54,note:'黑底碎边修复验收：对比视频左侧为你提供的导出，右侧为当前 AI 抠图导出。重点检查光圈外缘黑点，以及文字、飘带是否完整。'},gloweyes:{count:121,w:1080,h:1920,focus:53,note:'人物现状验收：已恢复到本轮开始时的画质，并非新一轮清边成果。请重点检查头发、手杖、腿部绿边，薄纱和投影残色。'},blue:{count:73,w:960,h:960,focus:29,note:'蓝幕回归：检查主体是否完整，光效透明过渡是否连续，切换黑白底查看边缘。'},minimax:{count:73,w:736,h:1280,focus:29,note:'青蓝光效回归：检查剑光外围是否出现深色硬边，人物和底座是否完整。'}};
const $=id=>document.getElementById(id),v=$('video'),c=$('canvas'),ctx=c.getContext('2d');let selected='scatter',mode='compare',bg='checker',index=54,token=0;const scene=new Image();scene.src='scene.png';
function highlight(attr,value){document.querySelectorAll('['+attr+']').forEach(b=>b.classList.toggle('active',b.getAttribute(attr)===value));}
function path(){return selected+'/frames/clean_'+String(index).padStart(4,'0')+'.png';}
function updateFrame(){const info=clips[selected];$('readout').textContent=`${index+1} / ${info.count} 帧`;$('frame').value=index;$('pngLink').href=path();}
async function draw(){const current=++token,img=new Image();img.src=path();await img.decode();if(current!==token)return;c.width=img.width;c.height=img.height;if(bg==='scene'){await scene.decode();if(current!==token)return;ctx.drawImage(scene,0,0,c.width,c.height);}else if(bg==='checker'){for(let y=0;y<c.height;y+=24)for(let x=0;x<c.width;x+=24){ctx.fillStyle=(x/24+y/24)%2?'#777':'#aaa';ctx.fillRect(x,y,24,24);}}else{ctx.fillStyle=bg;ctx.fillRect(0,0,c.width,c.height);}ctx.drawImage(img,0,0);c.dataset.frame=String(index);c.dataset.background=bg;}
function seek(n){index=Math.max(0,Math.min(clips[selected].count-1,n));updateFrame();if(mode==='png')draw();else{v.pause();v.currentTime=(index+.2)/24;}}
function refresh(){const info=clips[selected];highlight('data-clip',selected);highlight('data-mode',mode);$('note').textContent=info.note;$('frame').max=info.count-1;document.querySelector('[data-mode=compare]').hidden=selected!=='scatter';v.hidden=mode==='png';$('pngPane').hidden=mode!=='png';$('imageControls').hidden=mode!=='png';const url=mode==='compare'?'黑底碎边_完整对比.mp4':selected+'-review.mp4';$('videoLink').href=url;v.pause();if(mode==='png')draw();else{v.src=url;v.onloadedmetadata=()=>{v.currentTime=(index+.2)/24;};}updateFrame();}
document.querySelectorAll('[data-clip]').forEach(b=>b.onclick=()=>{selected=b.dataset.clip;index=clips[selected].focus;if(mode==='compare'&&selected!=='scatter')mode='video';refresh();});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;refresh();});document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{bg=b.dataset.bg;highlight('data-bg',bg);draw();});$('prev').onclick=()=>seek(index-1);$('next').onclick=()=>seek(index+1);$('frame').oninput=e=>seek(+e.target.value);$('zoom').onchange=e=>c.classList.toggle('actual',e.target.checked);v.ontimeupdate=()=>{if(mode==='png')return;index=Math.min(clips[selected].count-1,Math.floor(v.currentTime*24));updateFrame();};refresh();
</script></html>
