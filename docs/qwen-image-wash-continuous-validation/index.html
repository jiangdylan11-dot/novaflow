<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>洗图 · 连续重绘强度</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#131a17;color:#e5f1e9;font:15px/1.7 system-ui}main{max-width:1100px;margin:auto;padding:28px}h1{font-size:28px;margin:0}p{color:#abc0b2}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:20px 0}select{background:#253c2f;color:inherit;border:1px solid #5d7f69;border-radius:6px;padding:9px;font:inherit}input{accent-color:#32c087;flex:1}.stage{position:relative;max-width:840px;margin:auto;line-height:0;overflow:hidden}.stage img{display:block;width:100%}.original{position:absolute;inset:0;clip-path:inset(0 50% 0 0)}.line{position:absolute;inset:0 auto 0 50%;width:2px;background:#69eeb1}.tag{position:absolute;top:10px;padding:8px 12px;background:#11251ee6;line-height:1.4;border-radius:5px}.left{left:10px}.right{right:10px}a{color:#76eab2}.links{display:flex;gap:20px;flex-wrap:wrap}
</style>
<main>
<h1>洗图 · 连续重绘强度</h1>
<p>低强度保真润色，高强度允许更多重绘。同一张原图、同一种子、同一条工作流；只改变重绘强度，不再切换提示词、步数和参考策略。</p>
<div class="controls"><label for="mode">测试强度</label><select id="mode"><option value="after-low.png">0.20 · 低强度</option><option value="redraw-default.png">0.65 · 中高强度</option><option value="redraw-high.png">0.85 · 高强度</option></select><label for="split">对比分隔</label><input id="split" type="range" min="0" max="100" value="50"></div>
<div class="stage"><img id="result" src="after-low.png" alt="低强度洗图"><div class="original" id="original"><img src="source.png" alt="原图"></div><div class="line" id="line"></div><span class="tag left">原图</span><span class="tag right" id="label">0.20 · 低强度</span></div>
<p>比较纹理、材质、光影、脸部与背景的变化。滑块控制的是重绘幅度；画面质量不等于变化量，也不保证每个细节随强度线性变化。高强度更可能改变五官、服装和画风。</p>
<div class="links"><a id="full" href="after-low.png">打开当前结果</a><a href="source.png">原图</a><a href="README.md">验证说明</a></div>
</main>
<script>
const mode=document.getElementById('mode'),split=document.getElementById('split');
split.addEventListener('input',()=>{document.getElementById('original').style.clipPath=`inset(0 ${100-Number(split.value)}% 0 0)`;document.getElementById('line').style.left=split.value+'%'});
mode.addEventListener('change',()=>{const label=mode.selectedOptions[0].textContent;document.getElementById('result').src=mode.value;document.getElementById('result').alt=label;document.getElementById('label').textContent=label;document.getElementById('full').href=mode.value});
</script>
</html>
