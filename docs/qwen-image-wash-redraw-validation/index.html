<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qwen 质感重绘 · 实图对比</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#121815;color:#eaf4ee;font:15px/1.7 system-ui}main{max-width:1120px;margin:auto;padding:28px}h1{font-size:28px;margin:0}p{color:#a8c0b1}.controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:20px 0}select{background:#26372d;color:inherit;border:1px solid #557461;padding:9px;font:inherit;border-radius:6px}input{flex:1;accent-color:#28bb83}.stage{position:relative;max-width:860px;margin:auto;line-height:0;overflow:hidden}.stage img{width:100%;display:block}.original{position:absolute;inset:0;clip-path:inset(0 50% 0 0)}.line{position:absolute;inset:0 auto 0 50%;width:2px;background:#5be9a5}.tag{position:absolute;top:12px;padding:8px 12px;background:#11291fe6;border-radius:5px;line-height:1.4}.left{left:12px}.right{right:12px}a{color:#7ee9b5}.links{display:flex;gap:20px;flex-wrap:wrap;margin-top:18px}
</style>
<main>
<h1>Qwen 质感重绘 · 实图对比</h1>
<p>固定原图与种子 9122026。新版允许重绘局部造型、材质、光影与背景；画风和五官也可能变化。请结合原尺寸结果判断是否符合需求。</p>
<div class="controls"><label for="mode">查看结果</label><select id="mode"><option value="release-final/redraw-default.png">本次新版 · 默认 0.65</option><option value="release-final/redraw-high.png">本次新版 · 高强度 0.85</option><option value="../qwen-image-wash-validation/after-low.png">上一版 · 默认 0.20</option><option value="final/redraw-default.png">仅提高强度 · 0.65（未采用）</option></select><label for="split">对比分隔</label><input id="split" type="range" min="0" max="100" value="50"></div>
<div class="stage"><img id="result" src="release-final/redraw-default.png" alt="本次新版默认强度"><div class="original" id="original"><img src="release-final/source.png" alt="原图"></div><div class="line" id="line"></div><span class="tag left">原图</span><span class="tag right" id="label">本次新版 · 默认 0.65</span></div>
<p>本次新版直接读取图像，不再调用独立 Prompt Assistant 反推。低强度与透明素材仍保留空间参考；中高强度完整画面减弱重复空间约束，释放重绘幅度。运行记录与验证范围见下方说明。</p>
<div class="links"><a id="full" href="release-final/redraw-default.png">打开当前结果原图</a><a href="release-final/source.png">打开输入原图</a><a href="README.md">验证记录</a></div>
</main>
<script>
const mode=document.getElementById('mode'),split=document.getElementById('split');
split.addEventListener('input',()=>{document.getElementById('original').style.clipPath=`inset(0 ${100-Number(split.value)}% 0 0)`;document.getElementById('line').style.left=split.value+'%'});
mode.addEventListener('change',()=>{const text=mode.selectedOptions[0].textContent;document.getElementById('result').src=mode.value;document.getElementById('result').alt=text;document.getElementById('label').textContent=text;document.getElementById('full').href=mode.value});
</script>
</html>
