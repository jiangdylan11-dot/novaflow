<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qwen 洗图改造 · 实图对比</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111615;color:#e9f2ed;font:15px/1.65 system-ui,sans-serif}main{max-width:1140px;margin:auto;padding:32px 24px}h1{font-size:28px;margin:0 0 8px}p{color:#a8bab0;margin:8px 0 20px}.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:20px 0}select{background:#25362d;color:inherit;padding:10px;border:1px solid #42604d;border-radius:7px;font:inherit}input{flex:1;min-width:180px;accent-color:#33bc80}.stage{position:relative;max-width:860px;margin:auto;background:#252b28;line-height:0;overflow:hidden;border:1px solid #385342;border-radius:10px}.stage>img{width:100%;height:auto;display:block}.layer{position:absolute;inset:0;clip-path:inset(0 50% 0 0)}.layer img{width:100%;height:100%;object-fit:fill}.divider{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#65eca1;pointer-events:none}.tag{position:absolute;top:12px;padding:7px 12px;background:#111d19dc;border-radius:5px;font-size:12px;line-height:1.4}.left{left:12px}.right{right:12px}a{color:#7be9b0}.note{margin:20px auto;max-width:860px}.links{display:flex;gap:22px;flex-wrap:wrap}strong{color:#ecfff4}
</style>
<main>
<h1>Qwen 洗图改造 · 实图对比</h1>
<p>同一张原图、同一随机种子 9122026。拖动分隔线查看原图与生成结果，重点观察脸型、背包、裤子、背景和线条。</p>
<div class="bar"><label for="mode">结果</label><select id="mode"><option value="after-low.png">新版 · 低强度 0.20</option><option value="after-medium.png">新版 · 中强度 0.60</option><option value="before.png">旧版 · 强度 0.20</option></select><label for="split">分隔位置</label><input id="split" type="range" min="0" max="100" value="50"></div>
<div class="stage"><img id="result" src="after-low.png" alt="新版低强度洗图结果"><div class="layer" id="original"><img src="source.png" alt="原图"></div><div class="divider" id="line"></div><span class="tag left">原图</span><span class="tag right" id="label">新版 · 低强度 0.20</span></div>
<div class="note"><p id="timing">本次模型生成：旧版约 28 秒，新版低强度约 54 秒。为控制变量，使用固定描述替代实时反推；耗时不含反推阶段。</p><p>新版增加视觉参考、重新校准重绘强度并保留原尺寸输出。人物仍可能有细节变化；更接近原图不等于清晰度一定更高。中强度允许更多细节重绘。</p><div class="links"><a href="source.png">打开原图</a><a href="after-low.png">打开新版原尺寸图</a><a href="before.png">打开旧版图</a><a href="README.md">验证记录</a></div></div>
</main>
<script>
const slider=document.getElementById('split'),mode=document.getElementById('mode');
slider.addEventListener('input',()=>{document.getElementById('original').style.clipPath=`inset(0 ${100-Number(slider.value)}% 0 0)`;document.getElementById('line').style.left=slider.value+'%'});
mode.addEventListener('change',()=>{document.getElementById('result').src=mode.value;document.getElementById('label').textContent=mode.selectedOptions[0].textContent;document.getElementById('result').alt=mode.selectedOptions[0].textContent});
</script>
</html>
