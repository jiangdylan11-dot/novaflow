<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foart 首页 · 设计预览</title><style>
:root{color-scheme:dark;font-family:"Segoe UI","Microsoft YaHei",sans-serif;background:#090c0d;color:#eef2f0}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 25%,#12523d45,transparent 32%),radial-gradient(ellipse at 82% 20%,#762b3430,transparent 32%),radial-gradient(ellipse at 83% 100%,#105b413d,transparent 35%),#090c0d}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(153deg,transparent 25%,#36d8aa17 25.15%,transparent 25.5%),linear-gradient(166deg,transparent 33%,#a5474a18 33.1%,transparent 33.4%)}button{font:inherit;color:inherit;cursor:pointer}.shell{position:relative;max-width:1672px;min-height:100vh;margin:auto;padding:0 6%;display:flex;flex-direction:column}header{height:106px;display:flex;align-items:center;justify-content:space-between;gap:20px}.identity{display:flex;align-items:center;gap:22px}.logo{width:145px}.brand-note{border-left:1px solid #ffffff20;padding-left:22px;color:#919d97;letter-spacing:2.5px;font-size:10px}.head-right{display:flex;align-items:center;gap:18px;color:#acb8b0;font-size:12px}.badge{border:1px solid #ffffff20;border-radius:30px;padding:9px 16px;color:#dce7df}.badge b{color:#48dcb0}.avatar{width:30px;height:30px;display:grid;place-items:center;background:#285c4d;color:#a8f1d4;border-radius:50%}.demo{color:#87a398;font-size:11px}main{flex:1;padding:35px 0 42px}.eyebrow{font-size:10px;letter-spacing:2.2px;color:#86a497}.eyebrow:before{content:"";display:inline-block;width:24px;height:2px;background:#36d8aa;vertical-align:middle;margin-right:10px}h1{font-size:clamp(32px,3.5vw,48px);font-weight:500;letter-spacing:1px;margin:18px 0 8px}h1 em{font-style:normal;color:#65e2bc}.subtitle{color:#8b9890;font-size:14px;margin:0 0 34px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{text-align:left;position:relative;overflow:hidden;min-height:155px;border:1px solid #ffffff1a;border-radius:14px;background:linear-gradient(125deg,#171d1b,#101414);padding:26px;display:flex;align-items:center;gap:20px;transition:.2s}.card:hover,.card:focus-visible{border-color:#43d4a2;transform:translateY(-2px);box-shadow:0 8px 35px #19bd8430}.card:first-child{background:linear-gradient(120deg,#13352a,#101b17);border-color:#36d8aa77}.icon{width:58px;height:58px;flex:none;display:grid;place-items:center;border:1px solid #ffffff0e;border-radius:18px;background:#ffffff08;color:#7ce3c2;font-size:26px}.card strong{display:block;font-size:21px;font-weight:500;letter-spacing:.5px}.card small{display:block;color:#8e9d94;font-size:12px;margin-top:10px}.arrow{position:absolute;right:22px;bottom:22px;color:#86a398;font-size:20px}.num{position:absolute;right:24px;top:20px;color:#ffffff16;font-size:11px;letter-spacing:2px}.recent{margin-top:34px;border-top:1px solid #ffffff12;padding-top:24px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.tabs{display:flex;gap:25px}.tab{border:0;background:none;padding:0 0 12px;color:#89968f;font-size:14px}.tab.active{color:#e8f2eb;border-bottom:2px solid #36d8aa}.hint{font-size:11px;color:#7a8a81}.projects{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}.project{min-height:82px;border:1px solid #ffffff0d;border-radius:10px;background:#151a18;display:flex;align-items:center;gap:14px;padding:12px}.thumb{width:76px;height:54px;flex:none;border-radius:7px;background:linear-gradient(135deg,#1e634e,#152a25);display:grid;place-items:center;color:#9ae5c9;font-size:20px}.project:nth-child(2) .thumb{background:linear-gradient(135deg,#5e473e,#262527)}.project:nth-child(3) .thumb{background:linear-gradient(135deg,#3e415b,#23272d)}.project strong{font-size:13px;font-weight:500}.project p{font-size:11px;color:#7e8e84;margin:7px 0 0}.empty{color:#88978e;font-size:13px;padding:20px 0;display:none}footer{border-top:1px solid #ffffff12;padding:20px 0 25px;display:flex;justify-content:space-between;color:#77867e;font-size:12px}.toast{position:fixed;left:50%;bottom:35px;transform:translateX(-50%);background:#24382f;border:1px solid #4b8067;border-radius:8px;padding:12px 18px;color:#d9efe2;font-size:13px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}@media(max-width:850px){.grid,.projects{grid-template-columns:repeat(2,1fr)}.brand-note{display:none}}@media(max-width:560px){header{height:80px}.logo{width:115px}.head-right .badge{display:none}main{padding-top:22px}.grid,.projects{grid-template-columns:1fr}.card{min-height:115px}.demo{font-size:10px}footer{gap:15px}.hint{display:none}}
</style></head><body><div class="shell"><header><div class="identity"><img class="logo" src="../../renderer/assets/foart-logo-dark.svg" alt="Foart"><span class="brand-note">GAME × ART × AI</span></div><div class="head-right"><span class="demo">首页设计预览 · 演示数据</span><span class="badge"><b>◇</b>　积分 —</span><span class="avatar">F</span><span>Foart 用户</span></div></header><main><div class="eyebrow">YOUR CREATIVE SPACE</div><h1><em>创作，</em>从这里开始。</h1><p class="subtitle">选择你的创作方向，开始下一段灵感。</p><div class="grid"><button class="card" data-name="骨骼动画"><span class="num">01</span><span class="icon">◇</span><span><strong>骨骼动画</strong><small>拆图 · 绑定 · 动画制作</small></span><span class="arrow">↗</span></button><button class="card" data-name="AI 视频"><span class="num">02</span><span class="icon">▷</span><span><strong>AI 视频</strong><small>图生视频 · 视频编辑</small></span><span class="arrow">↗</span></button><button class="card" data-name="AI 音频"><span class="num">03</span><span class="icon">≋</span><span><strong>AI 音频</strong><small>音频创作 · 音效处理</small></span><span class="arrow">↗</span></button><button class="card" data-name="UI 设计"><span class="num">04</span><span class="icon">▱</span><span><strong>UI 设计</strong><small>游戏 UI · 界面设计</small></span><span class="arrow">↗</span></button><button class="card" data-name="绘画编辑"><span class="num">05</span><span class="icon">✳</span><span><strong>绘画编辑</strong><small>AI 绘画 · 图像处理</small></span><span class="arrow">↗</span></button><button class="card" data-name="常用工具"><span class="num">06</span><span class="icon">⌘</span><span><strong>常用工具</strong><small>图片处理 · 格式转换</small></span><span class="arrow">↗</span></button></div><section class="recent"><div class="section-head"><div class="tabs"><button class="tab active" data-tab="recent">最近项目</button><button class="tab" data-tab="favorites">我的收藏</button></div><span class="hint">以下为示意内容，尚未连接真实项目</span></div><div class="projects"><div class="project"><div class="thumb">◇</div><div><strong>角色动画项目</strong><p>示例项目</p></div></div><div class="project"><div class="thumb">▱</div><div><strong>游戏 UI 界面</strong><p>示例项目</p></div></div><div class="project"><div class="thumb">▷</div><div><strong>角色预览视频</strong><p>示例项目</p></div></div></div><div class="empty">暂无收藏。正式接入后，这里可展示你的收藏内容。</div></section></main><footer><span>Foart　<span class="demo">首页测试页</span></span><span>为创作，留一点想象。</span></footer></div><div class="toast" role="status"></div><script>const toast=document.querySelector('.toast');let timer;document.querySelectorAll('.card').forEach(b=>b.addEventListener('click',()=>{toast.textContent='“'+b.dataset.name+'”为预览入口，暂未连接编辑器';toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2500)}));document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));document.querySelector('.projects').style.display=b.dataset.tab==='recent'?'grid':'none';document.querySelector('.empty').style.display=b.dataset.tab==='favorites'?'block':'none'}));</script></body></html>
