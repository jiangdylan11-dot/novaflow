<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spine 工程查看器</title>
    <meta name="color-scheme" content="dark" />
    <style id="viewer-first-paint">
      html, html body { margin: 0; width: 100%; height: 100%; background: #202020; color: #eaeaea; color-scheme: dark; }
      html .app { background: #202020; }
      html .sidebar { background: #151515; }
      html .stage, html .player-mount { background-color: #1b1b1b; }
    </style>
    <link id="spine-runtime-style" rel="stylesheet" href="" />
    <link id="app-style" rel="stylesheet" href="styles.css?v=20260915-blend-backdrop" />
    <link rel="stylesheet" href="foart-theme.css?v=20261030-tools-7" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <section class="panel">
          <div id="dropZone" class="drop-zone" role="button" tabindex="0" aria-label="拖入动画工程，点击可多选文件" title="点击多选文件，或将工程文件、文件夹拖入此处或画布">
            <strong>拖入动画工程</strong>
            <span>支持分批添加多个 .json / .skel / .atlas / 贴图</span>
          </div>
          <input id="filePicker" class="visually-hidden" type="file" multiple />
        </section>

        <section class="panel stack">
          <div id="detectedVersion" class="hint">未检测到版本</div>
          <div id="statusText" class="status">等待文件</div>
        </section>

        <section class="panel stack">
          <div class="section-heading" title="Ctrl/⌘ 多选 · Shift 连选 · 拖动排序；+ 上移，- 下移">动画工程</div>
          <div class="layer-order-toolbar" role="toolbar" aria-label="工程层级">
            <button id="moveLayerDown" class="layer-order-button" type="button" title="下移（-）" aria-label="下移" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m-6-6 6 6 6-6"/></svg>
            </button>
            <button id="moveLayerUp" class="layer-order-button" type="button" title="上移（+）" aria-label="上移" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
            </button>
          </div>
          <div id="layerList" class="layer-list" aria-label="动画工程">
            <div class="layer-empty">暂无动画</div>
          </div>
        </section>

        <section class="panel stack">
          <label>
            <span>动画</span>
            <select id="animationSelect" disabled></select>
          </label>
          <button id="nextAnimationButton" class="soft-button" type="button" disabled title="选中的工程切换到各自的下一个动画">切换动画</button>
          <label>
            <span>皮肤</span>
            <select id="skinSelect" disabled></select>
          </label>
          <label class="range-row">
            <span>播放速度</span>
            <output id="speedValue">1.00x</output>
            <input id="speedRange" type="range" min="0" max="3" step="0.05" value="1" disabled />
          </label>
          <label class="range-row">
            <span>融合时长</span>
            <output id="mixValue">0.20s</output>
            <input id="mixRange" type="range" min="0" max="2" step="0.05" value="0.2" disabled />
          </label>
        </section>
      </aside>

      <main class="stage">
        <div id="playerMount" class="player-mount">
          <div id="sceneLayer" class="scene-layer">
            <img id="backgroundImage" class="stage-background" alt="" draggable="false" hidden />
          </div>
          <div id="emptyState" class="empty-state">
            <strong>加载 Spine 导出工程</strong>
            <span>可分批添加多个工程，并上传一张画布背景</span>
          </div>
          <div class="canvas-toolbar" role="toolbar" aria-label="画布显示">
            <button id="actualSizeButton" class="actual-size-button" type="button" disabled title="恢复 100% 原始尺寸">100%</button>
            <button id="autoFitButton" type="button" disabled title="完整显示画布中的工程和背景">自动适配</button>
          </div>
          <div class="canvas-actions" role="toolbar" aria-label="画布操作">
            <button id="resetTransformButton" type="button" disabled title="重置位置" aria-label="重置位置">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6"/><path d="M12 3v4m0 10v4M3 12h4m10 0h4"/></svg>
            </button>
            <button id="pickBackgroundButton" type="button" title="上传背景" aria-label="上传背景" aria-describedby="backgroundHint">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
            </button>
            <button id="clearBackgroundButton" type="button" disabled title="清除背景" aria-label="清除背景">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 3 18 18M21 15V5a2 2 0 0 0-2-2H9M3 9v10a2 2 0 0 0 2 2h14M5 21l5-5m4-4 2-2 5 5"/></svg>
            </button>
            <button id="premultiplyToggle" type="button" aria-pressed="true" disabled title="预乘 Alpha" aria-label="预乘 Alpha">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="12" height="12" rx="2"/><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M9 9h6v6H9z" fill="currentColor" fill-opacity=".35"/></svg>
            </button>
            <button id="carouselAnimationToggle" type="button" role="switch" aria-checked="false" disabled title="全局轮播动画：各工程播完当前动画后独立切换下一项" aria-label="轮播动画">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m17 2 4 4-4 4M3 11V8a2 2 0 0 1 2-2h16M7 22l-4-4 4-4m14-1v3a2 2 0 0 1-2 2H3"/></svg>
            </button>
            <input id="backgroundPicker" class="visually-hidden" type="file" accept="image/*" />
            <output id="backgroundHint" class="visually-hidden">未设置背景</output>
          </div>
        </div>
        <div class="stage-controls" aria-label="预览播放控制">
          <button id="playPauseButton" class="transport-button" type="button" title="播放" aria-label="播放" disabled></button>
          <div class="timeline-group">
            <input id="progressRange" class="progress-range" type="range" min="0" max="1" step="0.001" value="0" aria-label="播放进度" disabled />
            <input id="timeInput" class="progress-time" type="number" min="0" max="0" step="0.001" value="0.0" aria-label="当前时间（秒）" disabled />
            <output id="progressValue" class="visually-hidden">0.00s / 0.00s</output>
          </div>
        </div>
      </main>
    </div>

    <script src="vendor/novaflow-version-convert.js?v=3.7-roundtrip-1"></script>
    <script src="vendor/novaflow-skel-import.js?v=3.7-roundtrip-1"></script>
    <script src="foart-select.js?v=20261030-select-1"></script>
    <script src="app.js?v=20261030-viewer-interactions-8"></script>
  </body>
</html>
