<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>NovaFlow Compute Node</title>
<style>
  :root {
    --bg: #0b0b0b; --panel: #181818; --surface: #171717; --field: #070707;
    --text: #e5e7eb; --muted: #a0a0a0; --dim: #6b7280;
    --accent: #1ea672; --accent-hover: #25bc84; --danger: #ef4444; --warn: #f59e0b;
    --button: #333333;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    padding: 14px 16px; background: #242424; display: flex; align-items: center; gap: 9px;
    border-bottom: 1px solid #000;
  }
  .mark { width: 20px; height: 20px; border-radius: 6px;
    background: linear-gradient(135deg, #18b7ff, var(--accent)); }
  h1 { font-size: 14px; margin: 0; font-weight: 600; }
  .ver { font-size: 11px; color: var(--dim); margin-left: auto; }

  main { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #303030; border-radius: 4px; }

  .card { background: var(--panel); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; }
  .row { display: flex; align-items: center; gap: 9px; justify-content: space-between; }
  .k { color: var(--muted); font-size: 12px; }
  .v { font-weight: 500; text-align: right; word-break: break-all; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; flex: none; display: inline-block; }
  .dot.on { background: var(--accent); box-shadow: 0 0 6px rgba(30,166,114,.7); }
  .dot.busy { background: var(--warn); }
  .dot.err { background: var(--danger); }

  .status-line { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }

  label { color: var(--muted); font-size: 12px; display: block; margin-bottom: 4px; }
  input, select {
    width: 100%; background: var(--field); color: var(--text);
    border: 1px solid #2a2a2a; border-radius: 6px; padding: 7px 9px; font: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }

  button {
    border: 0; border-radius: 8px; background: var(--button); color: var(--text);
    padding: 0 14px; height: 34px; cursor: pointer; font: inherit;
  }
  button:hover:not(:disabled) { background: #3d3d3d; }
  button:disabled { background: #2b2b2b; color: #666; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button.wide { flex: 1; }

  .models { display: flex; flex-direction: column; gap: 5px; }
  .model { display: flex; justify-content: space-between; align-items: center;
    background: var(--surface); border-radius: 6px; padding: 6px 9px; font-size: 12px; }
  .ready { color: #7ce8b5; }
  .missing { color: var(--dim); }
  .invalid { color: #fca5a5; }

  #logs {
    background: #000; border-radius: 8px; padding: 9px; height: 150px; overflow-y: auto;
    font: 11px ui-monospace, Consolas, monospace; color: #9ca3af; white-space: pre-wrap; word-break: break-all;
  }
  .err-box { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3);
    color: #fca5a5; border-radius: 6px; padding: 8px 10px; font-size: 12px; line-height: 1.5; }
  .hint { color: var(--dim); font-size: 11px; line-height: 1.6; }
  .tabs { display: flex; gap: 5px; }
  .tab { flex: 1; height: 30px; background: #222; border-radius: 6px; font-size: 12px; }
  .tab.active { background: var(--accent); color: #fff; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <span class="mark"></span>
  <h1>NovaFlow Compute Node</h1>
  <span class="ver" id="version">v0.1.0</span>
</header>

<main>
  <div class="tabs">
    <button class="tab active" data-tab="status">状态</button>
    <button class="tab" data-tab="settings">设置</button>
    <button class="tab" data-tab="logs">日志</button>
  </div>

  <div id="err" class="err-box hidden"></div>

  <!-- ---------------------------------------------------------- status -->
  <section id="tab-status">
    <div class="card">
      <div class="status-line"><span class="dot" id="statusDot"></span><span id="statusText">未启动</span></div>
      <div class="row"><span class="k">GPU</span><span class="v" id="gpu">—</span></div>
      <div class="row"><span class="k">显存</span><span class="v" id="vram">—</span></div>
      <div class="row"><span class="k">ComfyUI</span><span class="v" id="comfy">—</span></div>
      <div class="row"><span class="k">当前任务</span><span class="v" id="task">空闲</span></div>
      <div class="row"><span class="k">已完成 / 失败</span><span class="v" id="stats">0 / 0</span></div>
      <div class="row"><span class="k">对外地址</span><span class="v" id="endpoint">—</span></div>
    </div>

    <div class="card" style="margin-top:12px">
      <span class="k">模型</span>
      <div class="models" id="models"><div class="hint">启动后自动检测</div></div>
    </div>

    <div style="display:flex; gap:8px; margin-top:12px">
      <button class="primary wide" id="startBtn">启动</button>
      <button class="wide" id="stopBtn" disabled>停止</button>
    </div>
  </section>

  <!-- -------------------------------------------------------- settings -->
  <section id="tab-settings" class="hidden">
    <div class="card">
      <div>
        <label for="controlUrl">NovaFlow 控制面地址</label>
        <input id="controlUrl" placeholder="https://xxx.supabase.co/functions/v1/novaflow-web" />
      </div>
      <div>
        <label for="registrationCode">注册码（首次接入时填写）</label>
        <input id="registrationCode" placeholder="NFW-XXXXXX-XXXXXX" />
      </div>
      <div>
        <label for="workerName">节点名称</label>
        <input id="workerName" />
      </div>
      <div>
        <label for="publicEndpoint">对外可达地址（留空则用本机地址）</label>
        <input id="publicEndpoint" placeholder="http://你的公网IP:8790" />
      </div>
      <div>
        <label for="gatewayPort">网关端口</label>
        <input id="gatewayPort" type="number" min="1024" max="65535" />
      </div>
      <div>
        <label for="comfyImageUrl">ComfyUI 图像端（必须是本机回环地址）</label>
        <input id="comfyImageUrl" />
      </div>
      <div>
        <label for="comfyVideoUrl">ComfyUI 视频端</label>
        <input id="comfyVideoUrl" />
      </div>
      <div>
        <label for="modelsRoot">models 目录（可选，用于离线检测）</label>
        <div style="display:flex; gap:6px">
          <input id="modelsRoot" placeholder="E:\NovaFlow\models" />
          <button id="pickModels" style="flex:none">选择</button>
        </div>
      </div>
      <button class="primary" id="saveBtn">保存设置</button>
      <div class="hint">
        ComfyUI 只会绑定在本机回环地址上，外部只能通过本节点的网关访问，
        且必须携带控制面下发的一次性凭证。本程序不持有任何 Supabase 密钥。
      </div>
    </div>
  </section>

  <!-- ------------------------------------------------------------ logs -->
  <section id="tab-logs" class="hidden">
    <div class="card">
      <div id="logs"></div>
      <button id="openLogs">打开日志文件夹</button>
    </div>
  </section>
</main>

<script>
  const api = window.novaflowWorker;
  const $ = (id) => document.getElementById(id);
  const FIELDS = ['controlUrl','registrationCode','workerName','publicEndpoint','gatewayPort','comfyImageUrl','comfyVideoUrl','modelsRoot'];

  function showError(message) {
    const box = $('err');
    if (!message) { box.classList.add('hidden'); box.textContent = ''; return; }
    box.classList.remove('hidden');
    box.textContent = message;
  }

  document.querySelectorAll('.tab').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      for (const name of ['status','settings','logs']) {
        $('tab-' + name).classList.toggle('hidden', name !== btn.dataset.tab);
      }
    });
  });

  const STATUS_TEXT = { idle: '在线 · 空闲', busy: '在线 · 工作中', offline: '离线', maintenance: '维护中' };
  const STATUS_DOT = { idle: 'on', busy: 'busy', offline: '', maintenance: '' };

  function render(state) {
    const running = Boolean(state && state.status && state.status !== 'offline');
    $('startBtn').disabled = running;
    $('stopBtn').disabled = !running;

    if (!state) {
      $('statusText').textContent = '未启动';
      $('statusDot').className = 'dot';
      return;
    }

    $('version').textContent = 'v' + (state.version || '0.1.0');
    $('statusText').textContent = STATUS_TEXT[state.status] || state.status;
    $('statusDot').className = 'dot ' + (STATUS_DOT[state.status] || '');

    $('gpu').textContent = state.gpu && state.gpu.detected
      ? state.gpu.name
      : '未检测到（需要 NVIDIA 驱动）';
    $('vram').textContent = state.gpu && state.gpu.vramMb
      ? Math.round(state.gpu.vramMb / 1024) + ' GB'
      : '—';

    const comfy = state.comfy || {};
    $('comfy').textContent = [
      comfy.image ? '图像 ✓' : '图像 ✗',
      comfy.video ? '视频 ✓' : '视频 ✗'
    ].join('   ');

    $('task').textContent = state.currentTaskId ? state.currentTaskId.slice(0, 8) + '…' : '空闲';
    $('stats').textContent = (state.stats?.completed || 0) + ' / ' + (state.stats?.failed || 0);
    $('endpoint').textContent = state.endpointUrl || '—';

    const models = state.models || [];
    $('models').innerHTML = models.length
      ? models.map((m) =>
          '<div class="model"><span>' + m.model_id + '</span><span class="' + m.status + '">' +
          ({ ready: 'Ready', missing: '缺失', invalid: '损坏', updating: '更新中' }[m.status] || m.status) +
          '</span></div>').join('')
      : '<div class="hint">未检测到模型</div>';

    showError(state.lastError || '');
  }

  function appendLog(line) {
    const box = $('logs');
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 20;
    box.textContent += line + '\n';
    if (atBottom) box.scrollTop = box.scrollHeight;
  }

  (async function init() {
    const config = await api.getConfig();
    for (const key of FIELDS) if ($(key)) $(key).value = config[key] == null ? '' : config[key];

    render(await api.getState());
    (await api.getLogs()).forEach(appendLog);
    api.onState(render);
    api.onLog(appendLog);
  })();

  $('saveBtn').addEventListener('click', async () => {
    const patch = {};
    for (const key of FIELDS) patch[key] = $(key).value.trim();
    patch.gatewayPort = Number(patch.gatewayPort) || 8790;
    await api.setConfig(patch);
    showError('');
    $('saveBtn').textContent = '已保存';
    setTimeout(() => { $('saveBtn').textContent = '保存设置'; }, 1200);
  });

  $('pickModels').addEventListener('click', async () => {
    const dir = await api.pickModelsFolder();
    if (dir) $('modelsRoot').value = dir;
  });

  $('startBtn').addEventListener('click', async () => {
    showError('');
    $('startBtn').disabled = true;
    const res = await api.start();
    if (!res.ok) { showError(res.error); $('startBtn').disabled = false; }
    else render(res.state);
  });

  $('stopBtn').addEventListener('click', async () => {
    const res = await api.stop();
    if (!res.ok) showError(res.error);
    render(res.state);
  });

  $('openLogs').addEventListener('click', () => api.openLogFolder());
</script>
</body>
</html>
