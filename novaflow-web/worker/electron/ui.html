<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>NovaFlow</title>
<style>
  :root {
    --bg: #141414; --panel: #202020; --surface: #1b1b1b; --field: #161616;
    --text: #ededee; --muted: #a8a8ad; --dim: #89898f;
    --accent: #1ea672; --accent-hover: #25bc84; --danger: #ef4444; --warn: #f59e0b;
    --button: #333333;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  .titlebar { height: 38px; flex: none; display: flex; align-items: center;
    padding: 0 150px 0 14px; background: #242424; -webkit-app-region: drag;
    user-select: none; border: 0; }
  .titlebar img { width: 136px; height: 25px; object-fit: contain; pointer-events: none; }
  .ver { margin-left: 10px; font-size: 11px; color: #8b929d; }

  main { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 12px; display: flex; flex-direction: column; gap: 14px; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #303030; border-radius: 4px; }

  .card { background: linear-gradient(125deg, #262626, #1d1d1d); border: 1px solid #ffffff0d; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 24px #0002; }
  .row { display: flex; align-items: center; gap: 9px; justify-content: space-between; }
  .k { color: var(--muted); font-size: 12px; }
  .v { font-weight: 500; text-align: right; word-break: break-all; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; flex: none; display: inline-block; }
  .dot.on { background: var(--accent); box-shadow: 0 0 6px rgba(30,166,114,.7); }
  .dot.busy { background: var(--warn); }
  .dot.err { background: var(--danger); }

  .status-line { display: flex; align-items: center; gap: 9px; font-size: 17px; font-weight: 600; }
  .status-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 2px 0 14px; }
  .badge { border: 1px solid #6d7e8144; border-radius: 20px; padding: 4px 10px; font-size: 11px; font-weight: 500; color: #a5a5ab; white-space: nowrap; }
  #activityBadge[data-active="true"] { background: #26bd8b12; border-color: #38c99866; color: #7ce3bf; }
  #sharing[data-active="true"] { background: #e9bc4610; border-color: #dfb64980; color: #efd078; }
  .hardware { display: flex; align-items: center; gap: 12px; border-top: 1px solid #ffffff12; padding: 16px 0; }
  .gpu-icon { width: 32px; height: 32px; flex: none; color: #a6a6ac; }
  .hardware-name { min-width: 0; flex: 1; }
  .hardware-name .v { display: block; text-align: left; margin-top: 5px; font-weight: 600; font-size: 14px; }
  .memory { text-align: right; flex: none; }
  .memory .v { display: block; font-size: 17px; font-weight: 600; margin-top: 4px; }
  .metrics { display: grid; grid-template-columns: 1fr 1fr 1fr; border-top: 1px solid #ffffff12; border-bottom: 1px solid #ffffff12; padding: 13px 0; }
  .metric + .metric { padding-left: 20px; border-left: 1px solid #ffffff15; }
  .metric .v { display: block; text-align: left; font-size: 17px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .connection { display: flex; align-items: center; gap: 16px; padding-top: 12px; min-width: 0; }
  #comfy { flex: none; font-size: 12px; color: #d2d2d6; }
  #tab-status > .card { gap: 0; }
  button, a { transition: background .15s, border-color .15s, box-shadow .15s; }
  button:focus-visible, a:focus-visible { outline: 2px solid #8ce4c5; outline-offset: 3px; }

  label { color: var(--muted); font-size: 12px; display: block; margin-bottom: 4px; }
  input, select {
    width: 100%; background: var(--field); color: var(--text);
    border: 1px solid #2a2a2a; border-radius: 6px; padding: 7px 9px; font: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }

  button {
    border: 0; border-radius: 8px; background: var(--button); color: var(--text);
    padding: 0 14px; height: 34px; cursor: pointer; font: inherit;
  }
  button:hover:not(:disabled) { background: #3d3d3d; }
  button:disabled { background: #2b2b2b; color: #666; cursor: not-allowed; }
  button.primary { background: linear-gradient(115deg, #22b68d, #129371); color: #fff; font-weight: 600; box-shadow: inset 0 1px #ffffff20; }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button.wide { flex: 1; }
  button.sharing { background: linear-gradient(115deg, #f2d374, #e8bd51); color: #27210e; font-weight: 600; box-shadow: inset 0 1px #fff5; }
  button.sharing:hover:not(:disabled) { background: #ffda65; }
  button.primary:disabled, button.sharing:disabled { opacity: .65; cursor: wait; }
  #launcher-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-top: 16px; }
  .launch-column { min-width: 0; position: relative; }
  .launch-column + .launch-column::before { content: ''; position: absolute; left: -12px; height: 100%; border-left: 1px solid #ffffff10; }
  .launch-column > button { width: 100%; height: 46px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; border-radius: 9px; }
  .launch-column svg { width: 23px; height: 23px; flex: none; }
  .footer-note { margin-top: 14px; border-top: 1px solid #ffffff10; padding-top: 10px; font-size: 10px; color: #95959b; }
  .registration-info { margin-top: 9px; padding: 10px 12px; border: 1px solid #ffffff12; border-radius: 8px; background: #ffffff03; }
  #registrationStatus { color: #d5d5da; font-size: 12px; font-weight: 600; }
  #registrationInfo[data-status="verified"] #registrationStatus { color: #7ce3bf; }
  #registrationIdentity { margin-top: 6px; color: #b0b0b6; font-size: 11px; overflow-wrap: anywhere; user-select: text; }
  #registrationHint { margin-top: 6px; }
  .website[aria-disabled="true"] { color: var(--dim); cursor: default; text-decoration: none; }
  .launch-progress { margin-top: 14px; font-size: 10px; color: #aaaab0; display: flex; flex-direction: column-reverse; gap: 8px; }
  .launch-progress progress { width: 100%; height: 4px; accent-color: var(--accent); display: block; border: none; border-radius: 5px; overflow: hidden; }
  progress::-webkit-progress-bar { background: #25453d; border-radius: 5px; }
  progress::-webkit-progress-value { background: #35bf93; border-radius: 5px; }
  #shareProgress progress::-webkit-progress-bar { background: #4c4228; }
  #shareProgress progress::-webkit-progress-value { background: #eac65f; }
  #shareProgress progress { accent-color: #f5c542; }


  .settings-card { gap: 14px; }
  .license-setting { padding: 12px 0; border-top: 1px solid #ffffff10; border-bottom: 1px solid #ffffff10; }
  .license-setting .hint { margin-top: 5px; }
  .license-setting #licenseState:empty { display: none; }
  #logs {
    background: #000; border-radius: 8px; padding: 9px; height: 150px; overflow-y: auto;
    font: 11px ui-monospace, Consolas, monospace; color: #9ca3af; white-space: pre-wrap; word-break: break-all;
  }
  .err-box { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3);
    color: #fca5a5; border-radius: 6px; padding: 8px 10px; font-size: 12px; line-height: 1.5; }
  .hint { color: var(--dim); font-size: 11px; line-height: 1.6; }
  .tabs { display: flex; gap: 12px; border-bottom: 1px solid #ffffff12; flex: none; }
  .tab { min-width: 78px; height: 44px; background: transparent; border-radius: 0; font-size: 13px; color: #a5a5ac; border-bottom: 2px solid transparent; }
  .tab.active { background: transparent; border-bottom-color: #35c99a; color: #f0f0f2; }
  .tab:hover:not(:disabled) { background: #ffffff05; color: #fff; }
  .hidden { display: none !important; }
  .website { display: block; text-align: center; margin-top: 12px; color: #5cc6a3; font-size: 12px; text-decoration: none; }
  #websiteLink { color: #dfc46f; }
  .website:hover { text-decoration: underline; }
  .license-overlay { position: fixed; inset: 0; z-index: 100; padding: 24px; display: grid; place-items: center; background: rgba(0,0,0,.72); }
  .license-dialog { width: min(520px, 100%); max-height: calc(100vh - 48px); overflow-y: auto; background: #1d1d1d; border: 1px solid #404040; border-radius: 12px; padding: 22px; box-shadow: 0 20px 60px #0008; }
  .license-heading { display: flex; align-items: center; justify-content: space-between; }
  .license-heading h2 { margin: 0; font-size: 20px; }
  #licenseClose { font-size: 22px; padding: 0; width: 32px; background: transparent; }
  #licenseMessage { color: #b6bdc7; line-height: 1.6; margin: 10px 0 16px; }
  .license-grid { display: grid; grid-template-columns: 88px minmax(0,1fr); gap: 10px 12px; padding: 14px; background: #151515; border-radius: 8px; font-size: 12px; }
  .license-grid span { color: #999; }
  .license-grid output { font: 12px ui-monospace,Consolas,monospace; overflow-wrap: anywhere; user-select: text; }
  #licenseText { width: 100%; min-height: 100px; margin-top: 14px; resize: vertical; background: #101010; color: #fff; border: 1px solid #383838; border-radius: 8px; padding: 10px; font: inherit; }
  .license-actions { display: flex; gap: 8px; margin-top: 14px; }
  .license-actions button { flex: 1; padding: 0 10px; }
  #licenseFeedback { min-height: 18px; font-size: 12px; line-height: 1.5; color: #fca5a5; margin-top: 12px; }

</style>
</head>
<body>
<div class="titlebar" aria-label="NovaFlow 标题栏"><img src="assets/logo.png" alt="NovaFlow" draggable="false" /><span class="ver" id="version"></span></div>

<main>
  <div class="tabs">
    <button class="tab active" data-tab="status">状态</button>
    <button class="tab" data-tab="settings">设置</button>
    <button class="tab" data-tab="logs">日志</button>
  </div>

  <div id="err" class="err-box hidden"></div>

  <!-- ---------------------------------------------------------- status -->
  <section id="tab-status">
    <div class="card">
      <div class="status-head">
        <div class="status-line"><span class="dot" id="statusDot"></span><span id="statusText">未启动</span><span class="badge" id="activityBadge">待启动</span></div>
        <span class="badge" id="sharing">分享未开启</span>
      </div>
      <div class="hardware">
        <svg class="gpu-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="7" y="7" width="18" height="18" rx="3"/><rect x="12" y="12" width="8" height="8" rx="1"/><path d="M11 2v5m5-5v5m5-5v5M11 25v5m5-5v5m5-5v5M2 11h5m-5 5h5m-5 5h5m18-10h5m-5 5h5m-5 5h5"/></svg>
        <div class="hardware-name"><span class="k">GPU</span><span class="v" id="gpu">—</span></div>
        <div class="memory"><span class="k">显存</span><span class="v" id="vram">—</span></div>
      </div>
      <div class="metrics">
        <div class="metric"><span class="k">当前任务</span><span class="v" id="task">空闲</span></div>
        <div class="metric"><span class="k">本机排队</span><span class="v" id="localQueue">0</span></div>
        <div class="metric"><span class="k">已完成 / 失败</span><span class="v" id="stats">0 / 0</span></div>
      </div>
      <div class="connection"><span class="k">生成服务</span><span id="comfy">—</span></div>
    </div>
    <div id="launcher-actions">
      <div class="launch-column">
        <button class="primary wide" id="novaFlowBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 2v10M6 5a9 9 0 1 0 12 0"/></svg><span id="novaFlowLabel">启动NovaFlow</span></button>
        <a class="website" id="localLink" href="#" aria-disabled="true">快捷打开本地界面 ↗</a>
        <div id="localProgress" class="launch-progress hidden" aria-live="polite"><span></span><progress max="100" value="0" aria-label="本地启动进度"></progress></div>
      </div>
      <div class="launch-column">
        <button class="sharing wide" id="shareBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="5" cy="12" r="3"/><circle cx="19" cy="5" r="3"/><circle cx="19" cy="19" r="3"/><path d="m8 10 8-4M8 14l8 4"/></svg><span id="shareLabel">开启算力分享</span></button>
        <a class="website" id="websiteLink" href="https://novaflow.jiangdylan11.workers.dev/">快捷打开外网界面 ↗</a>
        <div id="shareProgress" class="launch-progress hidden" aria-live="polite"><span></span><progress max="100" value="0" aria-label="算力分享启动进度"></progress></div>
      </div>
    </div>
    <div class="footer-note">本地与分享可独立开关 · 关闭窗口后在托盘继续运行</div>
  </section>

  <!-- -------------------------------------------------------- settings -->
  <section id="tab-settings" class="hidden">
    <div class="card settings-card">
      <div>
        <label for="registrationCode">算力分享注册码（仅首次接入使用）</label>
        <input id="registrationCode" placeholder="NFW-XXXXXX-XXXXXX" aria-describedby="registrationHint" />
        <div id="registrationInfo" class="registration-info" aria-live="polite">
          <div id="registrationStatus">正在读取接入记录…</div>
          <div id="registrationIdentity" class="hidden"></div>
          <div id="registrationHint" class="hint">本地启动使用机器授权，与算力分享注册码独立。</div>
        </div>
      </div>
      <div>
        <label for="workerName">节点名称</label>
        <input id="workerName" />
      </div>
      <div class="license-setting">
        <div class="row"><div><span class="k">本机授权</span><div class="hint">用于本地启动，已有授权自动读取</div></div><button id="licenseBtn">查看绑定</button></div>
        <div id="licenseState" class="hint"></div>
      </div>
      <button class="primary" id="saveBtn">保存设置</button>
    </div>
  </section>

  <!-- ------------------------------------------------------------ logs -->
  <section id="tab-logs" class="hidden">
    <div class="card">
      <div id="logs"></div>
      <button id="openLogs">打开日志文件夹</button>
    </div>
  </section>
</main>

<div id="licenseOverlay" class="license-overlay hidden">
  <section class="license-dialog" role="dialog" aria-modal="true" aria-labelledby="licenseTitle" tabindex="-1">
    <div class="license-heading"><h2 id="licenseTitle">机器码授权</h2><button id="licenseClose" aria-label="关闭授权窗口">×</button></div>
    <p id="licenseMessage">请导入授权文件或粘贴授权码，完成本机绑定。</p>
    <div class="license-grid">
      <span>授权状态</span><output id="bindingStatus">—</output>
      <span>到期时间</span><output id="bindingExpire">—</output>
      <span>license_key</span><output id="bindingKey">—</output>
      <span>machine_id</span><output id="bindingMachine">—</output>
    </div>
    <textarea id="licenseText" spellcheck="false" aria-label="授权码" placeholder="粘贴授权码或 license.nfl JSON 内容"></textarea>
    <div class="license-actions">
      <button id="licenseRefresh">重新验证</button>
      <button id="licenseImportFile">导入 license.nfl</button>
      <button class="primary" id="licenseImportText">粘贴导入</button>
    </div>
    <div id="licenseFeedback" aria-live="polite"></div>
  </section>
</div>

<script>
  const api = window.novaflowWorker;
  const $ = (id) => document.getElementById(id);
  // Only submit user-facing preferences; saved runtime configuration stays in the main process.
  const FIELDS = ['registrationCode','workerName'];

  function showError(message, success = false) {
    const box = $('err');
    if (!message) { box.classList.add('hidden'); box.textContent = ''; return; }
    box.classList.remove('hidden');
    box.textContent = message;
    box.style.color = success ? '#7ce8b5' : '';
    box.style.background = success ? 'rgba(30,166,114,.12)' : '';
    box.style.borderColor = success ? 'rgba(30,166,114,.4)' : '';
  }

  document.querySelectorAll('.tab').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      for (const name of ['status','settings','logs']) {
        $('tab-' + name).classList.toggle('hidden', name !== btn.dataset.tab);
      }
    });
  });

  const STATUS_TEXT = { idle: '在线 · 空闲', busy: '在线 · 工作中', offline: '离线', maintenance: '维护中' };
  const STATUS_DOT = { idle: 'on', busy: 'busy', offline: '', maintenance: '' };

  let lastState = null;
    let localBusy = false, localClosing = false, shareBusy = false;
    function renderProgress() {
      for (const kind of ['local', 'share']) {
        const item = lastState?.operations?.[kind], box = $(kind + 'Progress');
        box.classList.toggle('hidden', !item);
        if (!item) continue;
        const seconds = Math.max(0, Math.floor(((item.finishedAt || Date.now()) - item.startedAt) / 1000));
        box.querySelector('span').textContent = (kind === 'local' ? '本地：' : '分享：') + item.message + ' · ' + seconds + ' 秒';
        const bar = box.querySelector('progress');
        if (item.status === 'queued') bar.removeAttribute('value');
        else bar.value = item.percent;
      }
    }
    setInterval(renderProgress, 1000);
    function render(state) {
      lastState = state;
      renderProgress();
      renderRegistration(state?.registration);
      const running = Boolean(state && state.localRunning);
      $('localLink').setAttribute('aria-disabled', String(!running));
    $('novaFlowBtn').disabled = localBusy;
    $('novaFlowLabel').textContent = localBusy ? (localClosing ? '正在关闭…' : '正在启动…') : running ? '关闭NovaFlow' : '启动NovaFlow';
    $('shareBtn').disabled = shareBusy;
    $('shareLabel').textContent = shareBusy ? '正在处理…' : state?.sharing ? '停止算力分享' : '开启算力分享';
    $('sharing').textContent = state?.sharing ? '算力分享中' : '分享未开启';
    $('sharing').dataset.active = String(Boolean(state?.sharing));
    $('activityBadge').textContent = state?.currentTaskId ? '工作中' : running || state?.sharing ? '空闲' : '待启动';
    $('activityBadge').dataset.active = String(Boolean(running || state?.sharing));
    $('localQueue').textContent = state?.queuedLocal || 0;

    $('version').textContent = state?.version ? 'v' + state.version : '';
    if (!state) {
      $('statusText').textContent = '未启动';
      $('statusDot').className = 'dot';
      return;
    }

    $('statusText').textContent = running ? '本地已启动' : state.sharing ? '算力分享中' : state.draining ? '正在完成共享任务' : '未启动';
    $('statusDot').className = 'dot ' + (STATUS_DOT[state.status] || '');

    $('gpu').textContent = state.gpu && state.gpu.detected
      ? state.gpu.name
      : state.gpu ? '未检测到（需要 NVIDIA 驱动）' : '—';
    $('vram').textContent = state.gpu && state.gpu.vramMb
      ? Math.round(state.gpu.vramMb / 1024) + ' GB'
      : '—';

    const comfy = state.comfy || {};
    $('comfy').textContent = !state.gpu ? '—' : [
      comfy.image ? '图像 ✓' : '图像 ✗',
      comfy.video ? '视频 ✓' : '视频 ✗'
    ].join('   ');

    $('task').textContent = state.currentTaskId ? state.currentTaskId.slice(0, 8) + '…' : '空闲';
    $('stats').textContent = (state.stats?.completed || 0) + ' / ' + (state.stats?.failed || 0);



    if (state.lastError) showError(state.lastError);
  }

  function appendLog(line) {
    const box = $('logs');
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 20;
    box.textContent += line + '\n';
    if (atBottom) box.scrollTop = box.scrollHeight;
  }

  function renderRegistration(info = {}) {
    const status = info.status || 'new';
    $('registrationInfo').dataset.status = status;
    $('registrationStatus').textContent = ({
      verified: '已注册 · 本次连接已验证',
      saved: '已保存节点身份 · 等待连接验证',
      'different-control': '检测到其他控制面的节点记录',
      new: '未发现已保存的节点身份'
    })[status];
    $('registrationIdentity').classList.toggle('hidden', !info.workerId);
    $('registrationIdentity').textContent = info.workerId ? '节点：' + (info.workerName || '—') + '　｜　ID：' + info.workerId : '';
    const hints = {
      verified: '正在使用已保存的节点身份，无需重复填写。首次注册码接入成功后会自动清空。',
      saved: '将自动尝试复用历史身份；若已接入过，无需重复填写注册码。身份是否有效以连接结果为准。',
      'different-control': '历史身份与当前服务不一致，请联系管理员检查接入信息。',
      new: '首次开启算力分享需填写注册码，或从网页账号绑定节点。仅启动本地无需此码。'
    };
    $('registrationHint').textContent = hints[status] + (status === 'new' ? '' : ' 本地启动使用独立的机器授权。');
    $('registrationCode').placeholder = status === 'verified' ? '已接入，无需重复填写' : 'NFW-XXXXXX-XXXXXX';
  }

  (async function init() {
    const config = await api.getConfig();
    for (const key of FIELDS) if ($(key)) $(key).value = config[key] ?? '';

    render(await api.getState());
    (await api.getLogs()).forEach(appendLog);
    api.onState(render);
    api.onLog(appendLog);
  })();

  $('saveBtn').addEventListener('click', async () => {
    const patch = {};
    for (const key of FIELDS) patch[key] = $(key).value.trim();
    await api.setConfig(patch);
    render(await api.getState());
    showError('');
    $('saveBtn').textContent = '已保存';
    setTimeout(() => { $('saveBtn').textContent = '保存设置'; }, 1200);
  });

  $('novaFlowBtn').addEventListener('click', async () => {
    if (localBusy) return;
    const closing = Boolean(lastState?.localRunning);
    localClosing = closing;
    localBusy = true; showError(''); render(lastState);
    try {
      const res = await api[closing ? 'stop' : 'start']();
      render(res.state || await api.getState());
      if (res.needsLicense) openLicense(res.licenseState);
      else if (!res.ok) showError(res.error);
    } catch (error) { showError(String(error.message)); }
    finally { localBusy = false; render(lastState); }
  });
  $('shareBtn').addEventListener('click', async () => {
    if (shareBusy) return;
    const stopping = Boolean(lastState?.sharing);
    shareBusy = true; showError(''); render(lastState);
    try {
      const res = await api[stopping ? 'unshare' : 'share']();
      render(res.state || await api.getState());
      if (!res.ok) showError(res.error);
    } catch (error) { showError(String(error.message)); }
    finally { shareBusy = false; render(lastState); }
  });
    $('websiteLink').addEventListener('click', async event => {
    event.preventDefault();
    try { await api.openWebsite(); } catch (error) { showError(String(error.message)); }
    });
    $('localLink').addEventListener('click', async event => {
      event.preventDefault();
      if (!lastState?.localRunning) return;
      try { const res = await api.openLocal(); if (!res.ok) showError(res.error); }
      catch (error) { showError(String(error.message)); }
    });

  const isLicensed = state => state?.status === 'licensed' && !state.locked;
  let previousFocus = null, licenseBusy = false;
  function renderLicense(state) {
    const s = state || {};
    $('licenseTitle').textContent = isLicensed(s) ? '本机已授权' : s.status === 'unlicensed' ? '需要授权' : '授权失效';
    $('bindingStatus').textContent = s.status || '—';
    $('bindingExpire').textContent = s.expireAt || s.online?.remoteExpireAt || '—';
    $('bindingKey').textContent = s.licenseKey || s.online?.licenseKey || '—';
    $('bindingMachine').textContent = s.machineId || '—';
    $('licenseMessage').textContent = isLicensed(s) ? '本机绑定已完成，可关闭此窗口并点击“启动NovaFlow”。' : '请导入 license.nfl 或粘贴授权码，完成本机绑定和联网验证。';
  }
  function openLicense(state) {
    previousFocus = document.activeElement;
    renderLicense(state);
    $('licenseFeedback').textContent = '';
    $('licenseText').value = '';
    document.querySelector('main').inert = true;
    $('licenseOverlay').classList.remove('hidden');
    $('licenseClose').focus();
  }
  function closeLicense() {
    if (licenseBusy) return;
    $('licenseOverlay').classList.add('hidden');
    document.querySelector('main').inert = false;
    $('licenseText').value = '';
    previousFocus?.focus();
  }
  async function licenseAction(action) {
    if (licenseBusy) return;
    licenseBusy = true;
    for (const id of ['licenseRefresh','licenseImportFile','licenseImportText','licenseClose']) $(id).disabled = true;
    $('licenseFeedback').textContent = '正在验证授权…';
    let authorized = false;
    try {
      const res = await action();
      if (res.canceled) { $('licenseFeedback').textContent = ''; return; }
      if (res.state) renderLicense(res.state);
      authorized = res.ok && isLicensed(res.state);
      $('licenseFeedback').textContent = authorized ? '' : (res.error || res.state?.reason || '授权未通过，请检查授权内容。');
    } catch (error) { $('licenseFeedback').textContent = String(error.message); }
    finally {
      licenseBusy = false;
      for (const id of ['licenseRefresh','licenseImportFile','licenseImportText','licenseClose']) $(id).disabled = false;
    }
    if (authorized) {
      closeLicense();
      $('licenseState').textContent = '授权成功，请再次点击“启动NovaFlow”。';
      showError('授权成功，请再次点击“启动NovaFlow”。', true);
      $('novaFlowBtn').focus();
    }
  }
  $('licenseClose').addEventListener('click', closeLicense);
  $('licenseOverlay').addEventListener('keydown', event => {
    if (event.key === 'Escape') { event.preventDefault(); closeLicense(); }
    if (event.key === 'Tab') {
      const items = [...$('licenseOverlay').querySelectorAll('button:not(:disabled),textarea')];
      const first = items[0], last = items[items.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    }
  });
  $('licenseRefresh').addEventListener('click', () => licenseAction(() => api.license()));
  $('licenseImportFile').addEventListener('click', () => licenseAction(() => api.licenseImportFile()));
  $('licenseImportText').addEventListener('click', () => {
    const text = $('licenseText').value.trim();
    if (!text) { $('licenseFeedback').textContent = '请先粘贴授权内容。'; return; }
    licenseAction(() => api.licenseImportText(text));
  });
  $('licenseBtn').addEventListener('click', async () => {
    try { const res = await api.license(); if (res.ok) openLicense(res.state); else showError(res.error); }
    catch (error) { showError(String(error.message)); }
  });

  $('openLogs').addEventListener('click', () => api.openLogFolder());
</script>
</body>
</html>
